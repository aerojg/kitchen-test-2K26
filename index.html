<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시니어 요리 앱 (시제품 · 요리 111개)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* 앱 색상(시니어용 고정 팔레트) */
    --cream: #FFF6E3;
    --ink: #2E1F14;
    --persimmon: #E4590F;
    --persimmon-deep: #B8440A;
    --paper: #FFFFFF;
    --line: #E3D3B4;
    --mute: #CFC5B2;
    --mute-ink: #7A6B58;
    /* 앱 바깥 배경만 테마 대응 */
    --outer: #EADFC8;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --outer: #1B1510; }
  }
  :root[data-theme="dark"] { --outer: #1B1510; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--outer);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
  }

  .app {
    --fs: 24px;
    font-size: var(--fs);
    line-height: 1.4;
    font-weight: 700;
    max-width: 480px;
    min-height: 100dvh;
    margin: 0 auto;
    background: var(--cream);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .app[data-size="big"] { --fs: 30px; }
  .app[data-size="huge"] { --fs: 36px; }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.on { display: flex; }

  /* ---------- 글씨 크기 조절 ---------- */
  .sizer { display: flex; gap: 6px; align-items: center; }
  .sizer button {
    min-width: 52px; height: 52px; border-radius: 14px;
    border: 3px solid var(--ink); background: var(--paper);
    font-weight: 900; line-height: 1;
  }
  .sizer button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
  .sizer .s1 { font-size: 16px; }
  .sizer .s2 { font-size: 21px; }
  .sizer .s3 { font-size: 27px; }

  /* ---------- 첫 화면 ---------- */
  .home { padding: 16px 20px 28px; }
  .home .top { display: flex; justify-content: flex-end; }
  .home h1 {
    font-size: 1.5em; font-weight: 900; line-height: 1.3;
    margin: 28px 0 28px; letter-spacing: -0.02em;
  }
  .doors { display: flex; flex-direction: column; gap: 20px; flex: 1; }
  .door {
    flex: 1; min-height: 190px; border-radius: 28px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    padding: 24px 26px; gap: 8px; text-align: left; font-weight: 900;
    transition: transform .12s ease;
  }
  .door:active { transform: scale(0.98); }
  .door .ico { font-size: 2.1em; line-height: 1; }
  .door .t { font-size: 1.15em; line-height: 1.25; }
  .door.fill { background: var(--persimmon); color: #fff; }
  .door.line { background: var(--paper); color: var(--persimmon-deep); border: 6px solid var(--persimmon); }

  /* ---------- 공통 상단바 ---------- */
  .bar {
    position: sticky; top: 0; z-index: 5;
    background: var(--cream);
    padding: 12px 14px 10px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border-bottom: 3px solid var(--line);
  }
  .nav { display: flex; gap: 8px; }
  .navbtn {
    height: 56px; padding: 0 16px; border-radius: 16px;
    background: var(--paper); border: 3px solid var(--ink);
    font-size: 0.72em; font-weight: 900; white-space: nowrap;
  }

  /* ---------- 재료 고르기 ---------- */
  .chosen {
    position: sticky; z-index: 4;
    top: calc(83px + env(safe-area-inset-top, 0px));
    background: #FFEBC2; padding: 10px 14px; min-height: 64px;
    border-bottom: 3px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 0.72em;
  }
  .chosen .lead { font-weight: 900; }
  .chosen .none { color: var(--mute-ink); font-weight: 500; }
  .chip {
    background: var(--ink); color: var(--cream); border-radius: 999px;
    padding: 6px 14px; font-weight: 700; min-height: 44px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .chip b { font-size: 1.1em; }

  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 14px 8px;
  }
  .tabs .tab:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .tab {
    min-height: 64px; padding: 8px 12px; border-radius: 18px;
    background: #EDE3CC; border: 3px solid #D9CCAE; color: var(--mute-ink);
    font-size: 0.72em; font-weight: 500; line-height: 1.2; text-align: center;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .tab[aria-selected="true"] {
    background: var(--persimmon); border: 3px solid var(--persimmon-deep); color: #fff;
    font-weight: 900; font-size: 0.78em; position: relative;
    box-shadow: 0 6px 0 var(--persimmon-deep);
  }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 50%; bottom: -22px; margin-left: -14px;
    border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-top: 14px solid var(--persimmon);
  }
  .tab .n {
    background: var(--persimmon); color: #fff; border-radius: 999px;
    min-width: 30px; height: 30px; display: none; align-items: center; justify-content: center;
    font-size: 0.85em; padding: 0 8px;
  }
  .tab .n.show { display: inline-flex; }

  .panel {
    margin: 22px 14px 18px; border: 6px solid var(--persimmon); border-radius: 30px;
    background: #FFFBF2; overflow: hidden;
  }
  .ptitle {
    background: var(--persimmon); color: #fff; font-weight: 900; font-size: 0.85em;
    padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .ptitle .cnt { font-weight: 700; font-size: 0.85em; white-space: nowrap; }
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    padding: 16px 12px 14px;
  }
  .catwrap { padding: 4px 12px 16px; }
  .catdone {
    width: 100%; min-height: 68px; border-radius: 20px; padding: 8px 12px;
    background: var(--paper); color: var(--persimmon-deep);
    border: 4px solid var(--persimmon); font-weight: 900; font-size: 0.8em; line-height: 1.25;
    display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
  }
  .lastnote {
    background: #FFEBC2; border: 3px solid var(--persimmon); border-radius: 18px;
    padding: 12px 14px; margin-top: 12px; font-size: 0.72em; font-weight: 700; line-height: 1.45;
    text-align: center;
  }
  .lastnote[hidden] { display: none; }
  .catdone .pill {
    background: var(--persimmon); color: #fff; border-radius: 16px;
    padding: 10px 22px; min-height: 52px; display: inline-flex; align-items: center;
    box-shadow: 0 4px 0 var(--persimmon-deep);
  }
  .card {
    position: relative; min-height: 158px; border-radius: 24px;
    background: var(--paper); border: 4px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 14px 8px; font-weight: 900; text-align: center;
  }
  .card .em { font-size: 2.3em; line-height: 1; }
  .card .nm { font-size: 0.9em; line-height: 1.2; }
  .card[aria-pressed="true"] {
    border: 8px solid var(--persimmon); background: #FFF0DA; padding: 10px 4px;
  }
  .card .check {
    position: absolute; top: -6px; right: -6px; width: 44px; height: 44px; border-radius: 50%;
    background: var(--persimmon); color: #fff; display: none;
    align-items: center; justify-content: center; font-size: 1em; border: 4px solid var(--cream);
  }
  .card[aria-pressed="true"] .check { display: flex; }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    max-width: 480px; margin: 0 auto;
    background: linear-gradient(to top, var(--cream) 72%, rgba(255,246,227,0));
    padding: 22px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .card .al { display: block; font-size: 0.6em; font-weight: 500; color: var(--mute-ink); line-height: 1.2; margin-top: 2px; }
  .bottom-end { padding: 8px 16px calc(32px + env(safe-area-inset-bottom, 0px)); }
  .done {
    width: 100%; min-height: 76px; border-radius: 22px;
    background: var(--persimmon); color: #fff; font-weight: 900; font-size: 1em;
  }
  .done[disabled] { background: var(--mute); color: var(--mute-ink); cursor: not-allowed; }
  .hint { margin: 8px 4px 0; font-size: 0.68em; font-weight: 500; color: var(--mute-ink); text-align: center; min-height: 1.4em; }

  /* ---------- 다음 단계 안내 ---------- */
  .veil {
    position: fixed; inset: 0; z-index: 20; background: rgba(46,31,20,.6);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .veil.on { display: flex; }
  .box {
    background: var(--cream); border-radius: 28px; padding: 28px 24px; max-width: 440px; width: 100%;
    font-size: 24px; font-weight: 700; text-align: center;
  }
  .box h2 { margin: 0 0 12px; font-size: 1.1em; font-weight: 900; }
  .box p { margin: 0 0 22px; font-weight: 500; font-size: 0.8em; line-height: 1.5; }
  .box button { width: 100%; min-height: 68px; border-radius: 20px; background: var(--persimmon); color: #fff; font-weight: 900; }

  /* ---------- 추천 요리 3개 카드 ---------- */
  .rhead { padding: 20px 18px 6px; }
  .rhead h2 { margin: 0 0 8px; font-size: 1.25em; font-weight: 900; line-height: 1.3; }
  .rsub { font-size: 0.68em; font-weight: 500; color: var(--mute-ink); line-height: 1.5; }
  .rsub b { color: var(--ink); font-weight: 700; }
  .rcards { display: flex; flex-direction: column; gap: 16px; padding: 14px 14px 230px; }
  .rnote {
    background: #FFEBC2; border: 3px solid var(--persimmon); border-radius: 18px;
    padding: 12px 14px; font-size: 0.72em; font-weight: 700; line-height: 1.45; text-align: center;
  }
  .rcard {
    width: 100%; min-height: 158px; border-radius: 26px; background: var(--paper);
    border: 5px solid var(--line); padding: 16px 18px; text-align: left;
    display: flex; align-items: center; gap: 16px;
  }
  .rcard.ok { border-color: var(--persimmon); }
  .rcard:active { transform: scale(0.985); }
  .rcard .rem { font-size: 2.6em; line-height: 1; flex: 0 0 auto; }
  .rcard .rbody { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .rcard .rname { font-size: 1.1em; font-weight: 900; line-height: 1.2; }
  .rcard .rmeta { font-size: 0.68em; font-weight: 500; color: var(--mute-ink); }
  .rstat {
    display: inline-flex; align-self: flex-start; align-items: center; gap: 6px;
    border-radius: 999px; padding: 6px 14px; font-size: 0.7em; font-weight: 900; line-height: 1.25;
  }
  .rstat.ok { background: var(--persimmon); color: #fff; }
  .rstat.miss { background: #EDE3CC; color: var(--ink); border: 3px solid #D9CCAE; }
  .rbar .row { display: flex; gap: 10px; }
  .rbar .ghost {
    flex: 1; min-height: 68px; border-radius: 20px; background: var(--paper);
    border: 4px solid var(--persimmon); color: var(--persimmon-deep); font-weight: 900; font-size: 0.78em; line-height: 1.2;
    padding: 6px 8px;
  }
  .rbar .ghost[hidden] { display: none; }
  .rbar .plain {
    flex: 1; min-height: 68px; border-radius: 20px; background: var(--paper);
    border: 4px solid var(--ink); color: var(--ink); font-weight: 900; font-size: 0.78em; line-height: 1.2;
    padding: 6px 8px;
  }

  /* ---------- 시작 확인 ---------- */
  .cfm { padding: 34px 20px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; flex: 1; }
  .cfm .big { font-size: 4.6em; line-height: 1; }
  .cfm .cn { font-size: 1.45em; font-weight: 900; line-height: 1.2; }
  .cfm .cm { font-size: 0.7em; font-weight: 500; color: var(--mute-ink); }
  .cfm .cmiss { font-size: 0.72em; font-weight: 700; background: #FFEBC2; border: 3px solid var(--persimmon); border-radius: 18px; padding: 12px 16px; line-height: 1.45; }
  .cfm .cmiss[hidden] { display: none; }
  .cfm .cthaw { font-size: 0.74em; font-weight: 900; background: var(--paper); border: 3px solid var(--persimmon); border-radius: 18px; padding: 12px 16px; line-height: 1.45; color: var(--persimmon-deep); }
  .cfm .cthaw[hidden] { display: none; }
  .cfm .cver { font-size: 0.7em; font-weight: 700; background: #FFF6DD; border: 3px dashed var(--persimmon); border-radius: 18px; padding: 12px 16px; line-height: 1.5; color: var(--ink); white-space: pre-line; }
  .cfm .cver[hidden] { display: none; }
  .cfm .q { font-size: 1.15em; font-weight: 900; margin-top: 10px; }
  .cfm .btns { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: auto; }
  .cfm .yes { min-height: 84px; border-radius: 24px; background: var(--persimmon); color: #fff; font-weight: 900; font-size: 1em; box-shadow: 0 6px 0 var(--persimmon-deep); }
  .cfm .no { min-height: 72px; border-radius: 22px; background: var(--paper); border: 5px solid var(--persimmon); color: var(--persimmon-deep); font-weight: 900; font-size: 0.85em; }

  /* ---------- 레시피 화면 A~E ---------- */
  .rc-steps { display: flex; gap: 6px; padding: 12px 12px 0; }
  .rc-pill {
    flex: 1; min-height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: #EDE3CC; border: 3px solid #D9CCAE; color: var(--mute-ink);
    font-size: 0.6em; font-weight: 500; text-align: center;
  }
  .rc-pill.on { background: var(--persimmon); border-color: var(--persimmon-deep); color: #fff; font-weight: 900; }
  .rc-pill.past { background: var(--ink); border-color: var(--ink); color: var(--cream); font-weight: 700; }
  .rc-body { padding: 18px 16px 230px; display: flex; flex-direction: column; gap: 18px; }
  .rc-em { font-size: 4em; line-height: 1; text-align: center; }
  .rc-h { font-size: 1.4em; font-weight: 900; line-height: 1.25; text-align: center; margin: 0; }
  .rc-line { font-size: 0.75em; font-weight: 500; text-align: center; color: var(--mute-ink); line-height: 1.45; }
  .rc-meta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .rc-meta span { background: var(--paper); border: 3px solid var(--line); border-radius: 999px; padding: 6px 16px; font-size: 0.72em; font-weight: 900; }
  .rc-title { font-size: 1.15em; font-weight: 900; margin: 0; line-height: 1.3; }
  .cheat {
    background: var(--ink); color: var(--cream); border-radius: 26px; padding: 18px 18px 8px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .cheat .ch { font-size: 0.9em; font-weight: 900; color: #FFD9A8; }
  .cheat .item { border-top: 2px solid rgba(255,246,227,.25); padding: 14px 0 12px; display: flex; flex-direction: column; gap: 6px; }
  .cheat .item:first-of-type { border-top: 0; padding-top: 0; }
  .cheat .tag { align-self: flex-start; background: var(--persimmon); color: #fff; border-radius: 999px; padding: 3px 12px; font-size: 0.6em; font-weight: 900; }
  .cheat .desc { font-size: 0.85em; font-weight: 900; line-height: 1.4; }
  .cheat .why { font-size: 0.7em; font-weight: 500; line-height: 1.45; color: #F2E4C8; }
  .rsec { background: var(--paper); border: 4px solid var(--line); border-radius: 24px; padding: 6px 16px 10px; }
  .rsec.must { border-color: var(--persimmon); }
  .rsec h3 { margin: 12px 0 4px; font-size: 0.82em; font-weight: 900; }
  .irow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
    padding: 12px 2px; border-bottom: 2px solid var(--line); text-align: left; font-size: 0.8em;
  }
  .irow:last-child { border-bottom: 0; }
  .irow .in { font-weight: 900; }
  .irow .ia { font-weight: 500; color: var(--mute-ink); font-size: 0.85em; text-align: right; }
  .irow .alt { display: block; font-weight: 500; font-size: 0.75em; color: var(--mute-ink); }
  .irow .box2 { flex: 0 0 auto; width: 40px; height: 40px; border: 4px solid var(--ink); border-radius: 10px; background: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; }
  .irow.have .box2 { background: var(--persimmon); border-color: var(--persimmon-deep); color: #fff; }
  .rc-check {
    width: 100%; min-height: 68px; border-radius: 20px; background: var(--paper); border: 4px solid var(--persimmon);
    color: var(--persimmon-deep); font-weight: 900; font-size: 0.8em; padding: 8px 12px; line-height: 1.25;
  }
  .rc-sum { background: #FFEBC2; border: 3px solid var(--persimmon); border-radius: 18px; padding: 12px 14px; font-size: 0.72em; font-weight: 700; line-height: 1.45; text-align: center; }
  .prep { display: flex; align-items: flex-start; gap: 14px; width: 100%; text-align: left; background: var(--paper); border: 4px solid var(--line); border-radius: 22px; padding: 16px; font-size: 0.82em; font-weight: 700; line-height: 1.4; }
  .prep .pn { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: var(--cream); display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.9em; }
  .prep.did { background: #FFF0DA; border-color: var(--persimmon); }
  .prep.did .pn { background: var(--persimmon); }
  .prep.did .pt { text-decoration: line-through; text-decoration-thickness: 3px; color: var(--mute-ink); }
  .stepno { font-size: 0.75em; font-weight: 900; color: var(--persimmon-deep); text-align: center; }
  .action { font-size: 1.35em; font-weight: 900; line-height: 1.35; text-align: center; margin: 0; }
  .fire { align-self: center; display: inline-flex; align-items: center; gap: 10px; border-radius: 20px; padding: 12px 24px; font-weight: 900; font-size: 1em; background: var(--persimmon); color: #fff; box-shadow: 0 5px 0 var(--persimmon-deep); }
  .fire.off { background: var(--ink); box-shadow: 0 5px 0 #000; }
  .sign { background: var(--paper); border: 4px solid var(--line); border-radius: 22px; padding: 14px 16px; font-size: 0.78em; font-weight: 700; line-height: 1.45; }
  .sign .lb { display: block; font-size: 0.8em; color: var(--mute-ink); font-weight: 900; margin-bottom: 4px; }
  .safe { background: #FFEBC2; border: 4px solid var(--persimmon); border-radius: 22px; padding: 14px 16px; font-size: 0.78em; font-weight: 700; line-height: 1.45; }
  .safe .sp { margin-top: 8px; }
  .safe .sp b { display: block; font-weight: 900; }
  .safe .lb { display: block; font-size: 0.8em; color: var(--persimmon-deep); font-weight: 900; margin-bottom: 4px; }
  .cheat.step { padding: 16px 18px; }
  .timer { background: var(--paper); border: 4px solid var(--ink); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .tstart { width: 100%; background: #FFEBC2; border: 3px solid var(--persimmon); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; text-align: center; }
  .tstart .tl { font-size: 0.62em; font-weight: 900; color: var(--persimmon-deep); }
  .tstart .tv { font-size: 0.82em; font-weight: 900; line-height: 1.35; }
  .tnote { font-size: 0.62em; font-weight: 500; color: var(--mute-ink); text-align: center; line-height: 1.4; }
  .timer .tt { font-size: 1.9em; font-weight: 900; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  .timer .tt.end { color: var(--persimmon-deep); }
  .timer .tb { display: flex; gap: 10px; width: 100%; }
  .timer .tb button { flex: 1; min-height: 64px; border-radius: 18px; font-weight: 900; font-size: 0.8em; }
  .timer .go { background: var(--ink); color: var(--cream); }
  .timer .rs { background: var(--paper); border: 4px solid var(--ink); }
  .rbar2 .row { display: flex; gap: 10px; }
  .rbar2 .prev { flex: 1; min-height: 76px; border-radius: 22px; background: var(--paper); border: 4px solid var(--ink); font-weight: 900; font-size: 0.85em; }
  .rbar2 .next { flex: 2; min-height: 76px; border-radius: 22px; background: var(--persimmon); color: #fff; font-weight: 900; font-size: 1em; box-shadow: 0 5px 0 var(--persimmon-deep); }
  .fin { padding: 34px 18px 40px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  .fin .fe { font-size: 4.4em; line-height: 1; }

지용' 표시가 있는 그릇만 쓰세요.", "알루미늄 호일과 금속 그릇은 불꽃이 나서 쓰면 안 돼요.", "계란과 밤처럼 껍질이 있는 것은 껍질을 벗기거나 칼집을 내세요.", "밀봉된 용기는 뚜껑을 조금 열고 가열하세요.", "기름기와 수분이 많은 음식은 매우 뜨거워질 수 있어요."]}, "알레르기": {"제목": "⚠️ 알레르기 주의", "직접": "이 요리에 들어가는 재료", "가공": "가공 제품에 들어 있을 수 있어요", "공통": "포장 제품은 알레르기 표시를 꼭 확인하세요."}, "참고출처": ["식품의약품안전처 식중독 예방 6대 수칙(육류 75℃, 어패류 85℃ 1분 이상, 냉동식품 해동, 손 씻기)", "식품의약품안전처 알레르기 유발물질 표시대상(식품 등의 표시기준)", "식품의약품안전처 전자레인지용 식품용기 안전사용 가이드", "식품의약품안전처 감자 싹과 초록색 부분 안내", "식품안전나라 바실러스 세레우스균 안내(남은 밥 보관)"], "공개전확인": ["남은 밥 냉장 보관 기간 3일: 해외 기관 안내를 참고한 값이라 한국 기준(식품안전나라) 확인 필요", "인덕션 단계 대응표(약불 1~3, 중불 4~6, 강불 7~9)는 일반 지식이라 확인 필요", "냄비와 팬 지름 기준은 일반 가정 기준 추정값", "어패류와 고기 조리 시간이 85℃와 75℃ 1분 기준을 충족하는지 직접 조리와 온도계로 확인", "'통조림 햄' 명칭: 상표 현황은 특허청 KIPRIS에서 확인", "앱 이름과 로고 상표 사전 검색, 이용 안내와 AI 활용 고지 문구는 필요하면 전문가 상담", "정부 자료 인용의 이용 조건 확인, 재료 그림을 AI로 만들 경우 약관과 표시 확인"]}};</script>
<script>
  var DATA = [];
  var SEASON_ALT = {};
  var GUIDE = {};
  var IND = {};
  var ALIAS_MAP = {}, ALIAS_DISP = {}, AMBIG_N = {}, OTHERS_N = {}, ING_NOTE = {}, BRAND_N = {}, SEASON_N = {}, ING_EMO = {};
  var FREEZE_A = []; /* 먼저 해동이 필요한 재료(ingredients.json 냉동구분 A) */
  function norm(x) { return String(x).replace(/\s+/g, "").toLowerCase(); }
  var READY = false;

  var app = document.getElementById("app");
  var sHome = document.getElementById("s-home");
  var sPick = document.getElementById("s-pick");
  var chosenEl = document.getElementById("chosen");
  var tabsEl = document.getElementById("tabs");
  var gridEl = document.getElementById("grid");
  var doneBtn = document.getElementById("done");
  var hintEl = document.getElementById("hint");
  var veil = document.getElementById("veil");

  var picked = [];
  var activeTab = 0;

  function show(which) {
        ["home", "pick", "recs", "confirm", "recipe", "cats", "list", "help", "about"].forEach(function (k) {
      document.getElementById("s-" + k).classList.toggle("on", k === which);
    });
    window.scrollTo(0, 0);
  }

  var DISHES = [];
  var LV = ["", "⭐ 쉬움", "⭐⭐ 보통", "⭐⭐⭐ 어려움"];
  var recList = [], recPage = 0, recShort = false, chosenDish = null, confirmFrom = "recs";

  function buildRecs() {
    var scored = DISHES.map(function (d) {
      var miss = d.need.filter(function (n) { return picked.indexOf(n) < 0; });
      return { d: d, miss: miss, hit: d.need.length - miss.length };
    });
    var byRank = function (a, b) { return a.d.rank - b.d.rank; };
    var ok = scored.filter(function (s) { return s.miss.length === 0; }).sort(byRank);
    var one = scored.filter(function (s) { return s.miss.length === 1 && s.hit >= 1; }).sort(byRank);
    recList = ok.concat(one);
    recShort = recList.length < 3;
    if (recShort) {
      var rest = scored.filter(function (s) { return recList.indexOf(s) < 0; }).sort(function (a, b) {
        return a.miss.length - b.miss.length || a.d.lv - b.d.lv || a.d.rank - b.d.rank;
      });
      while (recList.length < 3 && rest.length) recList.push(rest.shift());
    }
    recPage = 0;
  }

  function missText(s) {
    if (!s.miss.length) return "지금 바로 가능";
    return s.miss.length === 1 ? s.miss[0] + "만 있으면 돼요" : s.miss.join(", ") + "가 있으면 돼요";
  }

  function renderRecs() {
    var wrap = document.getElementById("r-cards");
    wrap.innerHTML = "";
    document.getElementById("r-sub").innerHTML = "고르신 재료: <b></b>";
    document.getElementById("r-sub").querySelector("b").textContent = picked.join(", ");
    if (recShort) {
      var note = document.createElement("div");
      note.className = "rnote";
      note.textContent = "재료를 하나만 더 골라 보세요. 더 많은 요리가 나와요.";
      wrap.appendChild(note);
    }
    var start = recPage * 3;
    if (start >= recList.length) { recPage = 0; start = 0; }
    recList.slice(start, start + 3).forEach(function (s) {
      var b = document.createElement("button");
      b.className = "rcard" + (s.miss.length ? "" : " ok");
      b.innerHTML = "<span class='rem'></span><span class='rbody'><span class='rname'></span>" +
        "<span class='rmeta'></span><span class='rstat'></span></span>";
      b.querySelector(".rem").textContent = s.d.em;
      b.querySelector(".rname").textContent = s.d.name;
      b.querySelector(".rmeta").textContent = "⏱ " + s.d.min + "분  " + LV[s.d.lv];
      var st = b.querySelector(".rstat");
      st.className = "rstat " + (s.miss.length ? "miss" : "ok");
      st.textContent = (s.miss.length ? "" : "✔ ") + missText(s);
      b.onclick = function () { confirmFrom = "recs"; openConfirm(s); };
      wrap.appendChild(b);
    });
    document.getElementById("r-more").hidden = recList.length <= 3;
  }

  function openConfirm(s) {
    chosenDish = s;
    document.getElementById("cf-em").textContent = s.d.em;
    document.getElementById("cf-name").textContent = s.d.name;
    document.getElementById("cf-meta").textContent = "⏱ " + s.d.min + "분  " + LV[s.d.lv];
    var m = document.getElementById("cf-miss");
    if (s.miss.length) {
      m.hidden = false;
      m.textContent = "지금 없는 재료: " + s.miss.join(", ");
    } else { m.hidden = true; }
    var th = document.getElementById("cf-thaw");
    if (s.d.thaw) {
      th.hidden = false;
      th.textContent = (GUIDE.해동 && GUIDE.해동.제목) || "❄️ 냉동 재료는 먼저 해동하세요";
    } else { th.hidden = true; }
        var vr = document.getElementById("cf-ver");

          if (tm.left <= 0) { stopTimer(); tt.textContent = "시간이 다 됐어요!"; tt.classList.add("end"); go.textContent = "다시 시작"; beep(); }
        }
        go.onclick = function () {
          if (tm.running) { stopTimer(); go.textContent = "이어서 시작"; return; }
          if (tm.left <= 0) { tm.left = tm.total; tt.classList.remove("end"); tt.textContent = fmt(tm.left); }
          tm.running = true; tm.id = setInterval(tick, 1000); go.textContent = "⏸ 잠깐 멈춤";
        };
        rs.onclick = function () { stopTimer(); tm.left = tm.total; tt.classList.remove("end"); tt.textContent = fmt(tm.left); go.textContent = "⏱ " + secText(c.sec) + " 타이머 시작"; };
        body.appendChild(box);
      }

      var sg = el("div", "sign");
      sg.appendChild(el("span", "lb", "👀 이렇게 되면 다음으로"));
      sg.appendChild(document.createTextNode(c.sign));
      body.appendChild(sg);
      if (c.ck) {
        var gk = (GUIDE.익힘확인 || {})[c.ck.유형];
        var safeBox = el("div", "safe");
        safeBox.appendChild(el("span", "lb", "🔎 익힘 확인"));
        if (gk && gk.length === 2) {
          var q1 = el("div", "sp");
          q1.appendChild(el("b", "", "① 조리용 온도계가 있으면"));
          q1.appendChild(document.createTextNode(" " + gk[0].replace("조리용 온도계가 있으면 ", "")));
          var q2 = el("div", "sp");
          q2.appendChild(el("b", "", "② 온도계가 없으면"));
          q2.appendChild(document.createTextNode(" " + gk[1].replace("온도계가 없으면 ", "")));
          safeBox.appendChild(q1); safeBox.appendChild(q2);
          body.appendChild(safeBox);
        } else if (c.ck.문구) {
          safeBox.appendChild(document.createTextNode(c.ck.문구));
          body.appendChild(safeBox);
        }
      }
    }

    if (R.phase === 4) {
      var fin = el("div", "fin");
      fin.appendChild(el("div", "fe", "🎉"));
      fin.appendChild(el("h2", "fh", "완성이에요!"));
      fin.appendChild(el("div", "fs", "맛있게 드세요.\n" + d.name + " 만드느라 수고하셨어요."));
      fin.querySelector(".fs").style.whiteSpace = "pre-line";
      var keep = el("div", "rc-sum", "🥣 남은 음식은 2시간 안에 냉장고에 넣고, 다시 먹을 때는 속까지 팔팔 끓여서 드세요.");
      keep.style.width = "100%";
      fin.appendChild(keep);
      var b1 = el("button", "b1", "다른 요리 하기");
      b1.onclick = function () { picked = []; activeTab = 0; show("home"); };
      var b2 = el("button", "b2", "찾는 요리가 없어요");
      b2.onclick = function () { popup("요청 링크 자리", "여기에 무료 구글 폼 링크가 연결됩니다. 지금은 시안이라 연결되어 있지 않습니다."); };
      fin.appendChild(b1); fin.appendChild(b2);
      body.appendChild(fin);
    }
    window.scrollTo(0, 0);
  }

  document.getElementById("rc-prev").onclick = function () { goPrev(); };
  document.getElementById("rc-next").onclick = function () { goNext(); };
  document.getElementById("rc-back").onclick = function () { goPrev(); };
  document.getElementById("rc-home").onclick = function () { stopTimer(); keepAwake(false); picked = []; activeTab = 0; show("home"); };
  document.getElementById("catdone").onclick = function () {
    if (activeTab < DATA.length - 1) {
      activeTab += 1; renderTabs(); renderGrid();
      tabsEl.scrollIntoView({ behavior: "smooth", block: "start" });
    } else {
      hintEl.textContent = picked.length ? "모두 고르셨다면 위 큰 버튼을 눌러 주세요" : "재료를 하나 이상 골라 주세요";
    }
  };
  
  /* ================= 불 세기 도움말 ================= */
  function renderHelp() {
    var g = GUIDE.불세기 || {};
    var body = document.getElementById("help-body");
    body.innerHTML = "";
    body.appendChild(el("h2", "help-h", g.제목 || "🔥 불 세기 안내"));
    if (g.대응표) {
      var t = el("div", "help-sec");
      t.appendChild(el("h3", "", "불 세기와 인덕션 단계"));
      Object.keys(g.대응표).forEach(function (k) {
        var r = el("div", "help-row");
        r.appendChild(el("span", "hk", k));
        r.appendChild(el("span", "", g.대응표[k]));
        t.appendChild(r);
      });
      body.appendChild(t);
    }
    if (g.주의) body.appendChild(el("div", "help-note", g.주의));
    [["🔥 가스레인지", g.가스], ["🍳 인덕션", g.인덕션], ["📡 전자레인지", g.전자레인지]].forEach(function (p) {
      if (!p[1] || !p[1].length) return;
      var s = el("div", "help-sec");
      s.appendChild(el("h3", "", p[0]));
      p[1].forEach(function (x) { s.appendChild(el("div", "li", "• " + x)); });
      body.appendChild(s);
    });
  }
  function openHelp() { renderHelp(); show("help"); }
  document.getElementById("h-back").onclick = function () { show("recipe"); };
  document.getElementById("h-home").onclick = function () { stopTimer(); keepAwake(false); picked = []; activeTab = 0; show("home"); };

    /* ================= 이용 안내 ================= */
  function renderAbout() {
    var a = GUIDE.이용안내 || {};
    var r = GUIDE.제보창구 || {};
    var body = document.getElementById("about-body");
    body.innerHTML = "";
    body.appendChild(el("h2", "help-h", a.제목 || "이 앱을 쓰기 전에 읽어 주세요"));
    var sec = el("div", "help-sec");
    (a.문구 || []).forEach(function (t) { sec.appendChild(el("div", "li", "• " + t)); });
    body.appendChild(sec);
    if (r.링크 && r.링크.indexOf("http") === 0) {
      body.appendChild(el("div", "about-note", r.안내 || "오류나 위험한 점을 알려 주세요. 개인정보는 적지 마세요."));
      var lk = el("a", "about-link", "📝 오류·안전 제보, 의견 보내기");
      lk.href = r.링크;
      lk.target = "_blank";
      lk.rel = "noopener";
      body.appendChild(lk);
    }
  }
  document.getElementById("go-about").onclick = function () {
    if (!READY) { popup("자료를 불러오는 중이에요", "잠시 뒤에 다시 눌러 주세요."); return; }
    renderAbout(); show("about");
  };
  document.getElementById("a-back").onclick = function () { show("home"); };
  /* ================= 입구 2: 요리 이름으로 ================= */
  var CAT_ICON = { "국·찌개": "🍲", "볶음": "🍳", "밥·죽": "🍚", "반찬": "🥗", "조림·찜": "🥘", "면": "🍜", "구이·전": "🥞", "간단 한 그릇": "🥣" };
  var CAT_ORDER = ["국·찌개", "볶음", "밥·죽", "반찬", "조림·찜", "면", "구이·전", "간단 한 그릇"];
  var qNote = document.getElementById("q-note");

  function byRank(a, b) { return a.rank - b.rank; }

  function renderCats() {
    var g = document.getElementById("catgrid");
    g.innerHTML = "";
    CAT_ORDER.forEach(function (cat) {
      var n = DISHES.filter(function (d) { return d.cat === cat; }).length;
      if (!n) return;
      var b = el("button", "catbtn");
      b.appendChild(el("span", "ci", CAT_ICON[cat] || "🍽️"));
      b.appendChild(el("span", "cn", cat));
      b.appendChild(el("span", "cc", n + "가지"));
      b.onclick = function () {
        openList(cat + " 요리", n + "가지가 있어요. 먹고 싶은 요리를 눌러 보세요.",
          DISHES.filter(function (d) { return d.cat === cat; }).sort(byRank));
      };
      g.appendChild(b);
    });
  }

  function openList(title, sub, items, note) {
    document.getElementById("l-title").textContent = title;
    document.getElementById("l-sub").textContent = sub;
    var box = document.getElementById("dlist");
    box.innerHTML = "";
    if (!items.length) {
      var e = el("div", "lempty", note || "찾는 요리가 아직 없어요.\n이름을 조금 다르게 쓰거나, 종류에서 찾아보세요.");
      e.style.whiteSpace = "pre-line";
      var bb = el("button", "", "종류 보러 가기");
      bb.onclick = function () { show("cats"); };
      e.appendChild(bb);
      box.appendChild(e);
    }
    items.forEach(function (d) {
      var r = el("button", "drow");
      r.appendChild(el("span", "de", d.em));
      var body = el("span", "db");
      body.appendChild(el("span", "dn", d.name));
      var dm = el("span", "dm", "⏱ " + d.min + "분  " + LV[d.lv]);
      if (d.rice === "볶음밥형" || d.rice === "죽형") dm.appendChild(el("span", "tg", "🍚 찬밥 환영"));
      body.appendChild(dm);
      r.appendChild(body);
      r.appendChild(el("span", "da", "▶"));
      r.onclick = function () { confirmFrom = "list"; openConfirm({ d: d, miss: [] }); };
      box.appendChild(r);
    });
    show("list");
  }

  function openChoice(shown, opts) {
    document.getElementById("l-title").textContent = "'" + shown + "'은(는) 어느 쪽인가요?";
    document.getElementById("l-sub").textContent = "하나를 눌러 주세요.";
    var box = document.getElementById("dlist");
    box.innerHTML = "";
    opts.forEach(function (o) {
      var r = el("button", "drow");
      r.appendChild(el("span", "de", ING_EMO[o] || "🍽️"));
      var body = el("span", "db");
      body.appendChild(el("span", "dn", o));
      r.appendChild(body);
      r.appendChild(el("span", "da", "▶"));
      r.onclick = function () { runSearch(o); };
      box.appendChild(r);
    });
    show("list");
  }

  function runSearch(raw) {
    raw = String(raw).trim();
    var q = norm(raw);
    if (!q) { qNote.textContent = "찾을 요리 이름을 적어 주세요. 예: 김치찌개"; return; }
    qNote.textContent = "";
    if (AMBIG_N[q]) { openChoice(raw, AMBIG_N[q]); return; }
    if (OTHERS_N[q]) { openList("'" + raw + "' 안내", "", [], OTHERS_N[q]); return; }
    var std = ALIAS_MAP[q];
    var q2 = q, used = null;
    if (std && norm(std) !== q) { q2 = norm(std); used = raw; }
    else if (!std) {
      var keys = Object.keys(ALIAS_MAP).filter(function (k) { return k.length >= 2 && ALIAS_MAP[k] !== k && q.indexOf(k) > -1; })
        .sort(function (a, b) { return b.length - a.length; });
      if (keys.length) { q2 = q.replace(keys[0], norm(ALIAS_MAP[keys[0]])); used = keys[0]; std = ALIAS_MAP[keys[0]]; }
    }
    var brand = used && BRAND_N[norm(used)];
    var shown = brand ? std : raw;
    var items = DISHES.filter(function (d) {
      var nn = norm(d.name);
      return nn.indexOf(q) > -1 || nn.indexOf(q2) > -1 ||
        d.need.some(function (n) { var m = norm(n); return used ? m.indexOf(q2) > -1 : m.indexOf(q) > -1; });
    }).sort(byRank);
    var sub = items.length ? items.length + "가지를 찾았어요." : "";
    if (used && items.length) sub += " " + (brand ? "'" + std + "'(으)로 찾았어요." : "'" + used + "'은(는) '" + std + "'(으)로 찾았어요.");
    var note = null;
    if (!items.length && SEASON_N[q]) note = "'" + SEASON_N[q] + "'은(는) 기본 양념이라 재료로 고르지 않아도 돼요. 요리 화면에 양이 적혀 있어요.";
    openList("'" + shown + "' 찾은 결과", sub, items, note);
  }
  function doSearch() { runSearch(document.getElementById("q").value); }

  document.getElementById("c2-back").onclick = function () { show("home"); };
  document.getElementById("c2-home").onclick = function () { show("home"); };
  document.getElementById("l-back").onclick = function () { show("cats"); };
  document.getElementById("l-home").onclick = function () { show("home"); };
  document.getElementById("q-go").onclick = doSearch;
  document.getElementById("q").addEventListener("keydown", function (e) { if (e.key === "Enter") doSearch(); });

  /* 말로 입력: 지원하는 폰에서만 작동하고, 안 되면 글자 입력으로 안내 */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micBtn = document.getElementById("mic");
  micBtn.onclick = function () {
    if (!SR) { qNote.textContent = "이 폰에서는 말로 입력이 안 돼요. 글자로 적어 주세요."; return; }
    try {
      var rec = new SR();
      rec.lang = "ko-KR"; rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onresult = function (e) {
        document.getElementById("q").value = e.results[0][0].transcript.replace(/[.,!?]/g, "").trim();
        doSearch();
      };
      rec.onerror = function (ev) {
        micBtn.classList.remove("on");
        var c = ev && ev.error;
        qNote.textContent = (c === "not-allowed" || c === "service-not-allowed") ? "이 화면에서는 마이크를 쓸 수 없어요. 글자로 적어 주세요."
          : c === "no-speech" ? "말씀이 들리지 않았어요. 다시 눌러 주세요."
          : c === "network" ? "인터넷 연결을 확인하고 다시 눌러 주세요."
          : "말을 알아듣지 못했어요. 글자로 적어 주세요.";
      };
      rec.onend = function () { micBtn.classList.remove("on"); };
      micBtn.classList.add("on");
      qNote.textContent = "듣고 있어요. 요리 이름을 말씀해 주세요.";
      rec.start();
    } catch (err) { micBtn.classList.remove("on"); qNote.textContent = "말로 입력을 시작하지 못했어요. 글자로 적어 주세요."; }
  };

  /* ================= 데이터 불러오기 ================= */
  /* recipes.json / ingredients.json 의 한글 항목을 화면 코드가 쓰는 형태로 바꿈 */
  function adapt(r) {
    var m = r.재료;
    function alt(a) { return a && a.length ? "없으면 " + a.join(", ") : ""; }
    var opt = m.선택.map(function (x) { return [x.이름, x.계량, alt(x.대체)]; })
      .concat(m.기본양념.filter(function (x) { return !x.필수; }).map(function (x) { return [x.이름, x.계량, SEASON_ALT[x.이름] || ""]; }));
    return {
      id: r.id, name: r.이름, em: r.그림 || "🍽️", line: r.한줄설명, min: r.소요시간_분, lv: r.난이도,
      cat: r.분류, rank: r.인기순위,
      must: m.필수.map(function (x) { return [x.이름, x.계량, alt(x.대체)]; }),
      opt: opt,
      sauce: m.기본양념.filter(function (x) { return x.필수; }).map(function (x) { return [x.이름, x.계량]; }),
      water: m.물, thermo: r.온도계권장,
      cheats: r.치트키.map(function (c) { return { t: c.종류, desc: c.설명, why: c.이유, steps: c.적용단계 }; }),
      prep: r.손질,
      cook: r.조리.map(function (s) { return { a: s.동작, fire: s.불, sec: s.시간_초, sign: s.신호, ck: s.익힘확인, ts: s.타이머시작 }; }),
      tools: r.도구 || [], allergy: r.알레르기 || null, cautions: r.조심 || [],
      rice: r.밥안내 ? r.밥안내.유형 : null,
      ver: r.검증상태 || "미검증",
      thaw: m.필수.some(function (x) { return FREEZE_A.indexOf(x.이름) > -1; })
    };
  }
  function boot(recipes, ing, guide) {
    GUIDE = guide || {};
    IND = ing.인덕션대응 || {};
    ING_EMO = ing.재료그림 || {};
    ALIAS_MAP = {}; ALIAS_DISP = ing.별칭표시 || {}; AMBIG_N = {}; OTHERS_N = {}; ING_NOTE = ing.재료메모 || {}; BRAND_N = {}; SEASON_N = {};
    Object.keys(ing.재료묶음).forEach(function (t) { ing.재료묶음[t].forEach(function (n) { ALIAS_MAP[norm(n)] = n; }); });
    var al = ing.별칭검색 || {};
    Object.keys(al).forEach(function (std) { al[std].forEach(function (a) { ALIAS_MAP[norm(a)] = std; }); });
    var am = ing.모호한말 || {}; Object.keys(am).forEach(function (k) { AMBIG_N[norm(k)] = am[k]; });
    var ot = ing.별개재료안내 || {}; Object.keys(ot).forEach(function (k) { OTHERS_N[norm(k)] = ot[k]; });
    (ing.상표별칭 || []).forEach(function (b) { BRAND_N[norm(b)] = true; });
    (ing.기본양념 || []).forEach(function (n) { SEASON_N[norm(n)] = n; });
    var emo = ing.재료그림 || {};
    SEASON_ALT = ing.양념대체 || {};
    FREEZE_A = (ing.냉동구분 && ing.냉동구분.A) || [];
    DATA = Object.keys(ing.재료묶음).map(function (tab) {
      return { tab: tab, items: ing.재료묶음[tab].map(function (n) { return [n, emo[n] || "🍽️"]; }) };
    });
    recipes.forEach(function (r, i) {
      var d = adapt(r);
      RECIPES[d.id] = d;
      DISHES.push({ id: d.id, name: d.name, em: d.em, min: d.min, lv: d.lv,
        cat: d.cat, rice: d.rice, thaw: d.thaw, rank: d.rank == null ? 1000 + i : d.rank, need: d.must.map(function (x) { return x[0]; }) });
    });
    READY = true;
  }
  (function load() {
    if (window.__EMBED__) { boot(window.__EMBED__.recipes, window.__EMBED__.ingredients, window.__EMBED__.guide); return; }
    Promise.all([
      fetch("recipes.json").then(function (r) { return r.json(); }),
      fetch("ingredients.json").then(function (r) { return r.json(); }),
      fetch("guide.json").then(function (r) { return r.json(); })
    ]).then(function (a) { boot(a[0].레시피, a[1], a[2]); })
      .catch(function () { popup("자료를 불러오지 못했어요", "인터넷 연결을 확인하고 화면을 새로 고쳐 주세요."); });
  })();
</script>
